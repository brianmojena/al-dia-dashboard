name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    name: shared (commonTest)
    # macOS porque los tests corren sobre el target iosSimulatorArm64, que
    # necesita el toolchain de Kotlin/Native y Xcode.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Publicar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: shared/build/reports/tests/
